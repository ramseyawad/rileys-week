const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function decryptWith(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.i)},key,ub(P.c));
  return new TextDecoder().decode(pt);
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return await crypto.subtle.deriveBits({name:"PBKDF2",salt:ub(P.s),iterations:P.n,hash:"SHA-256"},base,256);
}
function show(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  document.title=doc.title;
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  document.body.querySelectorAll("script").forEach(old=>{const s=document.createElement("script");s.textContent=old.textContent;old.replaceWith(s);});
}
/* Auto-update: whenever the app is opened or brought back, check for a newer version */
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"});
    const t=await r.text(); const m=t.match(/"i": "([^"]+)"/);
    if(m&&m[1]!==P.i){location.replace(location.pathname+"?v="+encodeURIComponent(m[1].slice(0,8))+location.hash)}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
window.addEventListener("pageshow",checkUpdate);
setInterval(checkUpdate,30*60*1000);
(async()=>{
  let saved=null; try{saved=localStorage.getItem("rw-key")}catch(e){}
  if(saved){try{show(await decryptWith(ub(saved)));return}catch(e){try{localStorage.removeItem("rw-key")}catch(_){}}}
  const f=document.getElementById("f"); f.hidden=false; document.getElementById("pw").focus();
  f.onsubmit=async ev=>{
    ev.preventDefault(); const err=document.getElementById("err"); err.textContent="Checking...";
    try{
      const raw=await derive(document.getElementById("pw").value);
      const html=await decryptWith(raw);
      if(document.getElementById("keep").checked){try{localStorage.setItem("rw-key",bu(raw))}catch(e){}}
      show(html);
    }catch(e){err.textContent="That password isn't right. Try again.";}
  };
})();
})();
</script>
